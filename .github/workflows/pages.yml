# Publica docs/ en GitHub Pages.
#
# POR QUÉ EXISTE ESTE FICHERO. El 1 de septiembre la app del móvil llevaba dos
# días congelada en 138 shorts mientras el repositorio ya tenía 225: seis
# commits subidos y ninguna publicación, ni siquiera fallida.
#
# La primera explicación que escribí aquí era falsa y conviene dejarlo dicho,
# porque es el tipo de cosa que se copia sin comprobar: supuse que las subidas
# con credencial de aplicación no disparaban flujos. No es cierto —este mismo
# flujo se disparó solo con el `push` que lo trajo—. La causa real la cantó su
# registro a la primera:
#
#     Get Pages site failed. Error: Not Found
#
# O sea que GITHUB PAGES ESTÁ APAGADO en el repositorio. No es que el
# constructor implícito falle: es que ya no hay sitio publicado que construir,
# y por eso no salía ni un error. Alguien lo desactivó, o se desactivó solo,
# después de la publicación del 31 de agosto.
#
# `actions/configure-pages` sabe encenderlo con `enablement: true`, pero desde
# aquí no puede: el credencial del flujo no tiene ese permiso —«Resource not
# accessible by integration»—. Así que ese paso va SIN enablement y hace falta
# que Pablo lo encienda una vez a mano:
#
#     github.com/PabloVA02/CURVA → Settings → Pages → Source: GitHub Actions
#
# En cuanto esté encendido en ese modo, este flujo publica solo con cada
# subida a main, y además se puede pedir a mano por la API con
# `workflow_dispatch`, que es lo que hace falta cuando algo se atasca.
name: Publicar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, y sin cortar la que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` enciende Pages en modo «GitHub Actions» si estaba
      # en modo rama. Es lo que quita de en medio al constructor implícito.
      # Sin `enablement`: encenderlo pide un permiso que este credencial no
      # tiene, y con la opción puesta el flujo muere aquí en vez de decir qué
      # pasa. Se enciende una vez a mano en Settings → Pages.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: despliegue
        uses: actions/deploy-pages@v4
