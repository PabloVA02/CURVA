<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de la doblez</title><style>body{margin:0;background:#191b1a;color:#eee;font:14px system-ui}main{max-width:700px;margin:auto;padding:16px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}img{display:block;width:100%;height:auto;border-radius:9px}h1{font-size:24px}h2{font-size:16px}p{margin:0 0 8px;color:#aaa}/* Encuadernación: luz del lomo, hendidura y transición al plano de la tapa.

  overflow: hidden;

    rgb(0 0 0 / 23%) 43%,
    rgb(0 0 0 / 30%) 48%,
    rgb(0 0 0 / 12%) 59%,
    rgb(255 255 255 / 12%) 72%,
    rgb(255 255 255 / 3%) 85%,
    transparent 100%
  );
}
