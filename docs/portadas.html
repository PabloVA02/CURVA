","autor":"Primo Levi","ano":1947,"tema":"Historia","resumen":"escrito","cubierta_propia":true,"archivo_cubierta":"./assets/si-esto-hombre-CFwGKCRs.webp","alt":"La cubierta de «Si esto es un hombre»: sobre azul muy oscuro, una chaqueta de preso a rayas dibujada solo con las franjas claras, rota y desalineada, con un número cosido en el pecho."},{"id":"origenes-totalitarismo","titulo":"Los orígenes del totalitarismo","autor":"Hannah Arendt","ano":1951,"tema":"Historia","resumen":"escrito","cubierta_propia":true,"archivo_cubierta":"./assets/origenes-totalitarismo-YTvM60gl.webp","alt":"La cubierta de «Los orígenes del totalitarismo»: una franja negra y otra roja rasgadas dejan ver en medio una planta pequeña que crece por la grieta. Arriba, «El miedo convertido en sistema político»."},{"id":"eichmann-jerusalen","titulo":"Eichmann en Jerusalén","autor":"Hannah Arendt","ano":1963,"tema":"Historia","resumen":"escrito","cubierta_propia":true,"archivo_cubierta":"./assets/eichmann-jerusalen-B1YTtf1H.webp","alt":"La cubierta de «Eichmann en Jerusalén»: una pirámide de engranajes y archivadores oxidados con un hombrecito sentado a una mesa en la cima. Arriba, «Crónica de obediencia, culpa y responsabilidad»."},{"id":"homenaje-cataluna","titulo":"Homenaje a Cataluña","autor":"George Orwell","ano":1938,"tema":"Historia","resumen":"escrito","cubierta_propia":true,"archivo_cubierta":"./assets/homenaje-cataluna-D64aBNt5.webp","alt":"La cubierta de «Homenaje a Cataluña»: sobre azul noche, los tejados y campanarios de Barcelona en tonos tierra, y una cometa blanca subiendo desde la ciudad hacia las montañas del fondo."},{"id":"sobre-tirania","titulo":"Sobre la tiranía","autor":"Timothy Snyder","ano":2017,"tema":"Historia","resumen":"escrito","cubierta_propia":true,"archivo_cubierta":"./assets/sobre-tirania-BpCwTWKW.webp","alt":"La cubierta de «Sobre la tiranía»: una escalera de peldaños claros que baja por una ladera oscura hacia la parte de abajo de la portada, mientras arriba, en e const grid=document.getElementById('grid'), input=document.getElementById('search'), more=document.getElementById('more');
const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let limit=48;
function render(){
 const q=normalize(input.value.trim());
 const selected=books.filter(b=>!q||normalize(b.titulo+' '+b.autor).includes(q));
 grid.replaceChildren();
 for(const b of selected.slice(0,limit)){
  const card=document.createElement('article');
  if(b.archivo_cubierta){
   const cover=document.createElement('div');cover.className='curva-cubierta';
   const img=document.createElement('img');img.className='art';img.src=b.archivo_cubierta;img.alt=b.alt;img.loading='lazy';img.width=1024;img.height=1536;cover.append(img);card.append(cover);
  }else{
   const cover=document.createElement('div');cover.className='placeholder';
   const text=document.createElement('strong');text.textContent=b.titulo;cover.append(text);card.append(cover);
  }
  const title=document.createElement('h2');title.textContent=b.titulo;
  const author=document.createElement('p');author.className='author';author.textContent=b.autor;
  card.append(title,author);grid.append(card);
 }
 document.getElementById('result').textContent=selected.length?'':'No hay coincidencias.';
 more.hidden=selected.length<=limit;
}
input.addEventListener('input',()=>{limit=48;render()});more.addEventListener('click',()=>{limit+=48;render()});render();
</script></body></html>
