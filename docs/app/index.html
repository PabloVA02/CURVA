<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Curva · prototipo de microaprendizaje</title>

    <!-- QUE SE PUEDA INSTALAR EN EL MÓVIL. Pablo, el 30 de agosto: «¿es posible
         que de alguna forma me instale la app en mi móvil e ir probándola poco
         a poco?». Con esto, «Añadir a pantalla de inicio» deja un icono suyo y
         la abre a pantalla completa, sin las barras del navegador. -->
    <!-- FUERA DE LOS BUSCADORES. Pablo, el 30 de agosto: «me da un poco de
         miedo tener todo esto público por si me lo roban». Esto no la
         esconde —quien tenga el enlace entra, y eso es inevitable en algo
         que se abre en el móvil sin contraseña—, pero evita que se encuentre
         buscando, que es como se encuentran las cosas. Va con el
         `robots.txt`, y esta etiqueta es la que obedecen aunque no lo lean. -->
    <!-- LA APP VIVE EN /app/ DESDE EL 26 DE SEPTIEMBRE. Pablo compró
         curvaapp.net y quiso que el dominio a secas fuera la web de los
         anuncios («es feo empezar.html»). Este es el mismo apuntador que
         tenía la raíz, con las rutas a `../assets/` y su propio manifiesto y
         trabajador de servicio en esta carpeta. Ver LEEME-DOS-WEBS.md.

         LA BASE, «/»: el código de la app pide sus imágenes como
         «./assets/…» contando desde la página, y desde /app/ las buscaba en
         /app/assets/, que no existe. Con esta línea todo lo relativo cuenta
         desde la raíz, donde están. Por eso el manifiesto y el trabajador de
         servicio van con la ruta entera, /app/…: si no, cogerían los de la
         raíz y la app instalada abriría la web de los anuncios. -->
    <base href="/" />
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

    <link rel="manifest" href="/app/manifest.webmanifest" />
    <meta name="theme-color" content="#151515" />
    <link rel="apple-touch-icon" href="./icono-180.png" />
    <link rel="icon" type="image/png" href="./icono-192.png" />

    <!-- Las dos de iOS. `black-translucent` es lo que deja el fondo subir por
         debajo de la hora y la batería; la maqueta ya cuenta con ello, que
         para eso lleva `viewport-fit=cover` y los márgenes del área segura. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Curva" />
    <script type="module" crossorigin src="./assets/index-lectura-4f6d159823.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BAkDuUCk.css">
      <link rel="stylesheet" href="./assets/doblez-libro-579f5f1a39.css">
    <link rel="stylesheet" href="./assets/catalogo-compacto-6aca577b3a.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- El trabajador de servicio, solo cuando la página se sirve por HTTPS o
         desde el propio ordenador: en cualquier otro sitio el navegador lo
         rechaza y solo ensucia la consola. Registrarlo aquí y no en el código
         de la app es a propósito: no depende de que React arranque. -->
    <script>
      if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/app/sw.js", { scope: "/app/" }).catch(function () {
            /* Sin conexión o sin permiso: la app funciona igual, solo que sin
               guardar nada para la próxima. No es un error que haya que
               contarle a nadie. */
          });
        });
      }
    </script>
  </body>
</html>
